<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GEDs — GER Nordeste 2</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <main class="simple-page">
    <a class="backlink" href="index.html">← Início</a>

    <section class="page-hero">
      <div class="container">
        <div class="section-label">Estrutura Diocesana</div>
        <h1>GEDs do Nordeste 2</h1>
        <p>Clique em um estado para conhecer os Grupos Executivos Diocesanos e suas coordenações.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="ged-map-layout">

          <div class="ged-map-card">
            <div class="section-label">Mapa interativo</div>
            <h2>Nordeste 2</h2>

            <div class="ne2-map-image-wrapper">

              <img
                src="assets/mapa-ne2.png.png"
                class="ne2-map-image"
                alt="Mapa interativo do GER Nordeste 2 com Alagoas, Paraíba, Pernambuco e Rio Grande do Norte"
              >

              <!-- RIO GRANDE DO NORTE -->
              <button
                type="button"
                class="map-state map-state-rn"
                data-state="Rio Grande do Norte"
                aria-label="Selecionar Rio Grande do Norte"
                title="Rio Grande do Norte"
              >
                <span>RN</span>
              </button>

              <!-- PARAÍBA -->
              <button
                type="button"
                class="map-state map-state-pb"
                data-state="Paraíba"
                aria-label="Selecionar Paraíba"
                title="Paraíba"
              >
                <span>PB</span>
              </button>

              <!-- PERNAMBUCO -->
              <button
                type="button"
                class="map-state map-state-pe"
                data-state="Pernambuco"
                aria-label="Selecionar Pernambuco"
                title="Pernambuco"
              >
                <span>PE</span>
              </button>

              <!-- ALAGOAS -->
              <button
                type="button"
                class="map-state map-state-al active"
                data-state="Alagoas"
                aria-label="Selecionar Alagoas"
                title="Alagoas"
              >
                <span>AL</span>
              </button>

            </div>

            <p class="map-hint">Selecione AL, PB, PE ou RN.</p>
          </div>

          <div class="ged-info-panel">
            <div class="section-label">Coordenações</div>
            <h2 id="ged-state-title">Alagoas</h2>
            <div id="ged-state-list" class="ged-list">
              <p>Carregando...</p>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/geds.js"></script>
</body>
</html>
